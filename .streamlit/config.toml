[theme]
# 主题基础配置
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F6"
textColor = "#1F2937"
font = "sans serif"

[theme.base]
# 使用亮色主题
base = "light"

[client]
# 显示工具栏
showErrorDetails = false
toolbarMode = "minimal"

[server]
# 禁用文件监控（减少资源占用）
fileWatcherType = "none"
# 防止 CORS 问题
enableCORS = false
enableXsrfProtection = true

[runner]
# 关闭快速重运行（减少 DOM 冲突）
fastReruns = false
